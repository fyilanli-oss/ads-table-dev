<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AdsTable Klaviyo Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f6f6f6;color:#111}
    .wrap{max-width:980px;margin:0 auto;padding:24px}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .logo{font-size:28px;font-weight:950;letter-spacing:-1px}
    .card{background:#fff;border:1px solid #ddd;border-radius:22px;padding:20px;margin-bottom:16px}
    h1{font-size:34px;letter-spacing:-.05em;margin:0 0 8px}
    p{color:#666;line-height:1.5}
    .btn{border:0;background:#111;color:#fff;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .secondary{background:#fff;color:#111;border:1px solid #ddd}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    input,select{height:46px;border:1px solid #ddd;border-radius:14px;padding:0 12px;font-size:15px}
    input{min-width:260px}
    pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#fff;border-radius:18px;padding:18px;min-height:260px;overflow:auto;font-size:13px;line-height:1.45}
    .status{font-weight:850;margin-top:10px}
    .ok{color:#0f6b37}
    .err{color:#9b111e}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo">AdsTable</div>
      <button class="btn secondary" onclick="location.href='/dashboard'">Back to Dashboard</button>
    </div>

    <div class="card">
      <h1>Klaviyo API Test</h1>
      <p>This page calls Klaviyo endpoints with the active Supabase session token.</p>

      <div class="row">
        <button id="statusBtn" class="btn" onclick="runKlaviyoStatusTest()">Run Status</button>
        <button id="metricsBtn" class="btn secondary" onclick="runKlaviyoMetricsTest()">Run Metrics</button>
        <button id="eventsBtn" class="btn secondary" onclick="runKlaviyoEventsTest()">Run Events</button>
        <button id="campaignsBtn" class="btn secondary" onclick="runKlaviyoCampaignsTest()">Run Campaigns</button>
        <button class="btn secondary" onclick="copyJson()">Copy JSON</button>
      </div>

      <div class="row">
        <select id="dateRange">
          <option value="last_30d">last_30d</option>
          <option value="last_7d">last_7d</option>
          <option value="today">today</option>
          <option value="yesterday">yesterday</option>
        </select>
        <input id="limit" placeholder="limit e.g. 200" value="200"/>
        <input id="metricId" placeholder="Optional metric ID"/>
        <button id="insightsBtn" class="btn" onclick="runKlaviyoInsightsTest()">Run Insights</button>
      </div>

      <div class="row">
        <input id="estimatedMonthlySpend" placeholder="Estimated Monthly Klaviyo Spend"/>
        <select id="spendCurrency">
          <option value="USD">USD</option>
          <option value="TRY">TRY</option>
          <option value="EUR">EUR</option>
        </select>
        <button id="settingsBtn" class="btn secondary" onclick="saveKlaviyoSettings()">Save Setup</button>
      </div>

      <div id="status" class="status">Waiting...</div>
    </div>

    <div class="card"><pre id="output">{}</pre></div>
  </div>

  <script>
    let supabaseClient=null,session=null,lastJson={};

    function setStatus(text,type){
      const status=document.getElementById("status");
      status.textContent=text;
      status.className="status "+(type||"");
    }

    function printJson(data){
      lastJson=data;
      document.getElementById("output").textContent=JSON.stringify(data,null,2);
    }

    async function init(){
      try{
        const cfg=await fetch("/api/public-config").then(response=>response.json());
        if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){
          setStatus("Supabase config missing.","err");
          return;
        }
        supabaseClient=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
        const result=await supabaseClient.auth.getSession();
        session=result.data.session;
        if(!session){
          setStatus("Not logged in. Redirecting to login...","err");
          setTimeout(()=>location.href="/login",900);
          return;
        }
        setStatus("Logged in. Ready to test Klaviyo.","ok");
      }catch(error){
        setStatus(error.message,"err");
      }
    }

    function authHeaders(){
      return {"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"};
    }

    async function runButtonTest({buttonId,runningText,readyText,statusText,url}){
      const button=document.getElementById(buttonId);
      button.disabled=true;
      button.textContent=runningText;
      setStatus("Calling "+url.split("?")[0]+" ...","");
      try{
        const response=await fetch(url,{headers:authHeaders()});
        const data=await response.json().catch(()=>({}));
        printJson(data);
        if(!response.ok)throw new Error(data.error||statusText+" failed.");
        setStatus("Success. "+statusText+" received.","ok");
        return data;
      }catch(error){
        setStatus(error.message,"err");
        return null;
      }finally{
        button.disabled=false;
        button.textContent=readyText;
      }
    }

    async function runKlaviyoStatusTest(){
      const data=await runButtonTest({buttonId:"statusBtn",runningText:"Running...",readyText:"Run Status",statusText:"Klaviyo status",url:"/api/klaviyo/status"});
      if(data?.estimatedMonthlySpend)document.getElementById("estimatedMonthlySpend").value=data.estimatedMonthlySpend;
      if(data?.spendCurrency)document.getElementById("spendCurrency").value=data.spendCurrency;
    }

    async function runKlaviyoMetricsTest(){
      const data=await runButtonTest({buttonId:"metricsBtn",runningText:"Running...",readyText:"Run Metrics",statusText:"Klaviyo metrics",url:"/api/klaviyo/metrics"});
      if(data?.sampleMetrics?.length===1){
        document.getElementById("metricId").value=data.sampleMetrics[0].id||"";
      }
    }

    async function runKlaviyoEventsTest(){
      const dateRange=document.getElementById("dateRange").value;
      const limit=document.getElementById("limit").value||"200";
      const metricId=document.getElementById("metricId").value.trim();
      let url="/api/klaviyo/events?date_range="+encodeURIComponent(dateRange)+"&limit="+encodeURIComponent(limit);
      if(metricId)url+="&metric_id="+encodeURIComponent(metricId);
      await runButtonTest({buttonId:"eventsBtn",runningText:"Running...",readyText:"Run Events",statusText:"Klaviyo events",url});
    }

    async function saveKlaviyoSettings(){
      const button=document.getElementById("settingsBtn");
      button.disabled=true;
      button.textContent="Saving...";
      setStatus("Calling /api/klaviyo/settings ...","");
      try{
        const estimatedMonthlySpend=Number(document.getElementById("estimatedMonthlySpend").value);
        const spendCurrency=document.getElementById("spendCurrency").value;
        const response=await fetch("/api/klaviyo/settings",{method:"POST",headers:authHeaders(),body:JSON.stringify({estimatedMonthlySpend,spendCurrency})});
        const data=await response.json().catch(()=>({}));
        printJson(data);
        if(!response.ok)throw new Error(data.error||"Klaviyo settings save failed.");
        setStatus("Success. Klaviyo setup saved.","ok");
      }catch(error){
        setStatus(error.message,"err");
      }finally{
        button.disabled=false;
        button.textContent="Save Setup";
      }
    }

    async function runKlaviyoCampaignsTest(){
      const dateRange=document.getElementById("dateRange").value;
      const url="/api/klaviyo/campaigns?date_range="+encodeURIComponent(dateRange);
      await runButtonTest({buttonId:"campaignsBtn",runningText:"Running...",readyText:"Run Campaigns",statusText:"Klaviyo campaigns",url});
    }

    async function runKlaviyoInsightsTest(){
      const dateRange=document.getElementById("dateRange").value;
      const limit=document.getElementById("limit").value||"25";
      const url="/api/klaviyo/insights?date_range="+encodeURIComponent(dateRange)+"&limit="+encodeURIComponent(limit);
      await runButtonTest({buttonId:"insightsBtn",runningText:"Running...",readyText:"Run Insights",statusText:"Klaviyo insights",url});
    }

    async function copyJson(){
      try{
        await navigator.clipboard.writeText(JSON.stringify(lastJson,null,2));
        setStatus("JSON copied.","ok");
      }catch{
        setStatus("Could not copy JSON.","err");
      }
    }

    init();
  </script>
</body>
</html>
