name: Provider token production encrypted write

on:
  workflow_dispatch:
    inputs:
      expected_total:
        description: Approved connection total
        required: true
        default: "9"
        type: choice
        options:
          - "9"
      confirmation:
        description: Explicit production write confirmation
        required: true
        default: E1-T6D-PRODUCTION-WRITE
        type: choice
        options:
          - E1-T6D-PRODUCTION-WRITE
      dry_run_evidence_id:
        description: Accepted production dry-run run ID
        required: true
        default: "32245732566"
        type: string

permissions:
  contents: read

concurrency:
  group: provider-token-production-write
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate operation guards
        shell: bash
        env:
          EXPECTED_TOTAL: ${{ inputs.expected_total }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DRY_RUN_EVIDENCE_ID: ${{ inputs.dry_run_evidence_id }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          [[ "${EXPECTED_TOTAL}" == "9" ]] || exit 1
          [[ "${CONFIRMATION}" == "E1-T6D-PRODUCTION-WRITE" ]] || exit 1
          [[ "${DRY_RUN_EVIDENCE_ID}" =~ ^[0-9]+$ ]] || exit 1
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete test suite
        run: npm test

  production-write:
    needs: validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-token-backfill
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run encrypted write operator
        env:
          EXPECTED_TOTAL: ${{ inputs.expected_total }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PROVIDER_TOKEN_ACTIVE_KEY_ID: ${{ vars.PROVIDER_TOKEN_ACTIVE_KEY_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROVIDER_TOKEN_ENCRYPTION_KEYS: ${{ secrets.PROVIDER_TOKEN_ENCRYPTION_KEYS }}
          PROVIDER_TOKEN_BACKFILL_REFERENCE_SECRET: ${{ secrets.PROVIDER_TOKEN_BACKFILL_REFERENCE_SECRET }}
        run: node scripts/provider-token-backfill-write.js --expected-total "${EXPECTED_TOTAL}" --confirm "${CONFIRMATION}"
