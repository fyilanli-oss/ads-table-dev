name: Provider token production dry-run

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Redacted dry-run batch size
        required: true
        default: "25"
        type: choice
        options:
          - "1"
          - "10"
          - "25"
          - "50"
          - "100"
      cursor:
        description: Opaque cursor from the preceding reviewed dry-run
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: provider-token-production-dry-run
  cancel-in-progress: false

jobs:
  validation:
    name: Validate main branch and dry-run contract
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            printf '%s\n' 'This workflow may only run from the main branch.' >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression and workflow security tests
        run: npm test

  production-dry-run:
    name: Run protected production dry-run
    needs: validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-token-backfill
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run dry-run operator
        shell: bash
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          CURSOR: ${{ inputs.cursor }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PROVIDER_TOKEN_ACTIVE_KEY_ID: ${{ vars.PROVIDER_TOKEN_ACTIVE_KEY_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROVIDER_TOKEN_ENCRYPTION_KEYS: ${{ secrets.PROVIDER_TOKEN_ENCRYPTION_KEYS }}
          PROVIDER_TOKEN_BACKFILL_REFERENCE_SECRET: ${{ secrets.PROVIDER_TOKEN_BACKFILL_REFERENCE_SECRET }}
        run: |
          set -euo pipefail
          args=(--batch-size "${BATCH_SIZE}")
          if [[ -n "${CURSOR}" ]]; then
            args+=(--cursor "${CURSOR}")
          fi
          node scripts/provider-token-backfill-dry-run.js "${args[@]}"
